<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAP · Laboratório de áudio</title>
    <style>
      :root {
        --bg: #0f1412;
        --panel: #161d1a;
        --line: #26302b;
        --ink: #d9e2dc;
        --muted: #8a978f;
        --accent: #e8473b;
        --on: #2f6b4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      header { padding: 16px 20px 4px; }
      header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
      header h1 b { color: var(--accent); }
      header p { margin: 4px 0 0; color: var(--muted); }
      #app { padding: 8px 20px 40px; display: grid; gap: 14px; max-width: 1100px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; }
      h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      button {
        background: #1f2925; color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
        padding: 5px 9px; margin: 0 6px 6px 0; font: inherit; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--on); }
      .grid { display: flex; flex-wrap: wrap; }
      .row { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 6px; }
      .slider, .field, .check { display: inline-flex; align-items: center; gap: 6px; margin: 0 14px 6px 0; }
      .slider span, .field span { color: var(--muted); }
      textarea { width: 100%; background: #0c100e; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px; font: inherit; margin-bottom: 6px; }
      select { background: #0c100e; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font: inherit; padding: 3px; }
      .status { margin: 0; color: var(--muted); }
      .status[data-ready='true'] { color: #7fd1a3; }
      .beat { display: inline-block; min-width: 4em; color: var(--accent); }
      pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1><b>QAP</b> · laboratório de áudio</h1>
      <p>Tudo sintetizado em tempo real (Web Audio). Página de teste manual — não entra no build do jogo.</p>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/client/audio/lab.ts"></script>
  </body>
</html>
